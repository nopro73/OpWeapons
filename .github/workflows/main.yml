name: Build Java Minecraft Plugin

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven Anywhere
      run: |
        POM_PATH=$(find . -name "pom.xml" | head -n 1)
        echo "Found pom.xml at: $POM_PATH"
        mvn -B clean package --file "$POM_PATH"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HeartWeapons-Plugin
        path: "**/target/*.jar"
