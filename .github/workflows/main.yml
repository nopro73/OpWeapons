name: Build Java Minecraft Plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Clean and Force Rebuild Project Root
      run: |
        # Make sure the script file is fully updated on the server
        chmod +x build.sh
        bash build.sh
        
        # Override the broken mirror link and compile using the clean public nexus hub endpoint
        mvn -B clean package -Dmaven.repo.local=.m2/repository -Drepo.url=https://spigotmc.org --file pom.xml

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HeartWeapons-Plugin
        path: |
          *.jar
          target/*.jar
