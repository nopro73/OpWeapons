name: Build Java Minecraft Plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Run Overwrite & Rebuild Script
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HeartWeapons-Plugin
        path: "target/*.jar"
