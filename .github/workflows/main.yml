name: Build Java Minecraft Plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Run Overwrite & Auto-Fix Link Script
      run: |
        chmod +x build.sh
        # Automatically fixes line 21 link right here on the server
        sed -i 's|https://spigotmc.org|https://spigotmc.org|g' build.sh
        bash build.sh

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HeartWeapons-Plugin
        path: |
          *.jar
          target/*.jar
